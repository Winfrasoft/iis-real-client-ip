# Apache httpd as a reverse proxy in front of IIS
#
# Unlike Nginx and HAProxy, mod_proxy_http adds X-Forwarded-For
# automatically when proxying, along with X-Forwarded-Host and
# X-Forwarded-Server. There is nothing to switch on for the client
# address itself.
#
# The scheme is the part you usually do have to set by hand.

<VirtualHost *:443>
    ServerName www.example.com

    SSLEngine on
    SSLCertificateFile    /etc/pki/tls/certs/example.crt
    SSLCertificateKeyFile /etc/pki/tls/private/example.key

    # Pass the original Host through rather than rewriting it to the
    # backend's name. IIS host-header bindings usually depend on this.
    ProxyPreserveHost On

    # TLS terminates here, so tell the backend what the client used.
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://10.0.0.11/
    ProxyPassReverse / http://10.0.0.11/
</VirtualHost>

# Notes
#
# mod_proxy appends to X-Forwarded-For rather than replacing it, so a
# chain arriving from an upstream CDN is preserved.
#
# Apache will happily forward a header a client invented. If Apache is
# directly internet-facing, the leftmost entry is client-controlled and
# must not be trusted. Validate from the right on the IIS side.
#
# If you terminate TLS upstream and Apache speaks plain HTTP to the
# client, remove the RequestHeader line or you will label plain
# requests as https.
#
# For the IIS half of this, see ../README.md
