# Nginx as a reverse proxy in front of IIS
#
# Nginx does NOT forward the client address unless you tell it to.
# Without proxy_set_header, IIS sees only the Nginx server's address
# and there is nothing for the IIS side to read.

upstream iis_backend {
    server 10.0.0.11:80;
    server 10.0.0.12:80;
}

server {
    listen 443 ssl;
    server_name www.example.com;

    location / {
        proxy_pass         http://iis_backend;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Optional. Single value, always the immediate peer, never a chain.
        # Useful when you want an unambiguous address alongside the chain.
        proxy_set_header   X-Real-IP         $remote_addr;
    }
}

# Notes
#
# $proxy_add_x_forwarded_for APPENDS $remote_addr to any X-Forwarded-For
# already present, preserving the chain through multiple hops. Do not
# replace it with $remote_addr alone unless you intend to discard
# upstream hops: behind a CDN that would throw away the real client.
#
# If Nginx is itself behind another proxy (a CDN, say), the header it
# receives is attacker-controllable up to the first hop you trust.
# Whatever consumes this on the IIS side must validate the chain from
# the right against a trust list, not take the leftmost value.
#
# For the IIS half of this, see ../README.md
# Full guide: https://winfrasoft.com/kb/iis-real-client-ip-behind-nginx-haproxy/
