# HAProxy in front of IIS
#
# HAProxy does NOT add X-Forwarded-For unless "option forwardfor" is set.
# One line, but it is easy to miss because everything else works fine
# without it.

defaults
    mode    http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/example.pem
    default_backend iis_servers

    # Tell the backend the client used HTTPS, since the TLS session
    # terminates here and IIS would otherwise see plain HTTP.
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http  if !{ ssl_fc }

backend iis_servers
    # The line that matters. Appends the client address to
    # X-Forwarded-For, creating the header if it is absent.
    option forwardfor

    server web1 10.0.0.11:80 check
    server web2 10.0.0.12:80 check

# Notes
#
# "option forwardfor" can live in defaults, a frontend or a backend.
# Putting it in defaults covers every backend, which is usually what
# you want and avoids the common failure of adding it to one backend
# and forgetting the others.
#
# To use a different header name:
#     option forwardfor header X-Client-IP
# If you do, the IIS side has to be told to read that name instead.
#
# "option forwardfor except 127.0.0.0/8" skips the header for requests
# from a given network, occasionally useful for local health checks.
#
# For the IIS half of this, see ../README.md
# Full guide: https://winfrasoft.com/kb/iis-real-client-ip-behind-nginx-haproxy/
